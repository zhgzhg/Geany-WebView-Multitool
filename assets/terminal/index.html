<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="vendor/xterm.css">
<title>Terminal</title>
<style>
  html, body { height:100%; margin:0; background:#1e1e1e; }
  /* Tab row: only shown when more than one terminal is configured. */
  #tabbar { position:absolute; top:0; left:0; right:0; height:26px; display:none;
            box-sizing:border-box; padding:2px 4px 0; gap:2px;
            background:#252526; border-bottom:1px solid #333; }
  body.tabs #tabbar { display:flex; }
  #tabbar button { min-width:34px; padding:2px 10px; border:none; cursor:pointer;
                   background:transparent; color:#969696;
                   font:12px system-ui, sans-serif;
                   border-top-left-radius:4px; border-top-right-radius:4px; }
  #tabbar button.active { background:#1e1e1e; color:#d4d4d4; }
  /* Unseen output in a background terminal: tint until its tab is opened. */
  #tabbar button.activity { color:#e5b567; font-weight:bold; }
  /* Session-only tab controls (term.js): "+" after the last tab, trash at the
     far right (only while a "+"-added tab is active). */
  #tab-add { min-width:26px; font-size:14px; line-height:1; }
  #tab-add:disabled { color:#4d4d4d; cursor:default; }
  #tab-add:not(:disabled):hover, #tab-trash:hover { color:#d4d4d4; }
  #tab-trash { margin-left:auto; display:flex; align-items:center;
               justify-content:center; }
  #terms { position:absolute; top:0; bottom:0; left:0; right:0; }
  body.tabs #terms { top:26px; }
  .slot { position:absolute; inset:0; padding:4px; box-sizing:border-box; display:none; }
  .slot.active { display:block; }
  /* Find bar (Ctrl+F): overlay top-right, above the active terminal. */
  #findbar { position:absolute; top:4px; right:14px; z-index:3; display:none;
             align-items:center; gap:4px; padding:3px 6px;
             background:#252526; border:1px solid #454545; border-radius:4px;
             box-shadow:0 2px 8px rgba(0,0,0,.4);
             font:12px system-ui, sans-serif; }
  body.tabs #findbar { top:30px; }
  #findbar.open { display:flex; }
  #findbar input { width:170px; background:#3c3c3c; color:#d4d4d4;
                   border:1px solid #3c3c3c; outline:none; padding:2px 6px;
                   font:inherit; }
  #findbar input:focus { border-color:#007fd4; }
  #find-count { color:#969696; font-size:11px; min-width:40px; text-align:center; }
  #findbar button { border:none; background:transparent; color:#c5c5c5;
                    cursor:pointer; font-size:11px; padding:2px 5px;
                    border-radius:3px; }
  #findbar button:hover { background:#37373d; }
</style>
</head>
<body>
  <div id="tabbar"></div>
  <div id="terms"></div>
  <div id="findbar">
    <input id="find-input" type="text" placeholder="Find">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous match (Shift+Enter)">&#x25b2;</button>
    <button id="find-next" title="Next match (Enter)">&#x25bc;</button>
    <button id="find-close" title="Close (Escape)">&#x2715;</button>
  </div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="term.js"></script>
</body>
</html>
