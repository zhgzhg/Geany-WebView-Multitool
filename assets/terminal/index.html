<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="vendor/xterm.css">
<title>Terminal</title>
<style>
  html, body { height:100%; margin:0; background:#1e1e1e; }
  /* Tab row: only shown when more than one terminal is configured. */
  #tabbar { position:absolute; top:0; left:0; right:0; height:26px; display:none;
            box-sizing:border-box; padding:2px 4px 0; gap:2px;
            background:#252526; border-bottom:1px solid #333; }
  body.tabs #tabbar { display:flex; }
  #tabbar button { min-width:34px; padding:2px 10px; border:none; cursor:pointer;
                   background:transparent; color:#969696;
                   font:12px system-ui, sans-serif;
                   border-top-left-radius:4px; border-top-right-radius:4px; }
  #tabbar button.active { background:#1e1e1e; color:#d4d4d4; }
  /* Unseen output in a background terminal: tint until its tab is opened. */
  #tabbar button.activity { color:#e5b567; font-weight:bold; }
  #terms { position:absolute; top:0; bottom:0; left:0; right:0; }
  body.tabs #terms { top:26px; }
  .slot { position:absolute; inset:0; padding:4px; box-sizing:border-box; display:none; }
  .slot.active { display:block; }
</style>
</head>
<body>
  <div id="tabbar"></div>
  <div id="terms"></div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="term.js"></script>
</body>
</html>
