<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Permissive so the HTML-preview iframe (which inherits this policy for
     srcdoc) can render arbitrary user HTML. The Markdown content is
     independently sanitized with DOMPurify, so it is safe regardless. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: blob: https: http:;
               img-src * data: blob:; media-src * data: blob:; font-src * data:;
               style-src 'self' 'unsafe-inline';
               script-src 'self' 'unsafe-inline' 'unsafe-eval';
               frame-src * data: blob:;">
<link id="md-theme" rel="stylesheet" href="vendor/github-markdown-dark.css">
<link id="hl-theme" rel="stylesheet" href="vendor/highlight-github-dark.css">
<title>Preview</title>
<style>
  /* Theme palette (chrome) switches with the body class; the .markdown-body
     colours come from the swappable github-markdown-<theme>.css. */
  body.theme-dark  { color-scheme:dark;
      --page-bg:#0d1117; --bar-bg:#161b22; --bar-border:#30363d;
      --btn-bg:#21262d; --btn-fg:#c9d1d9; --btn-hover:#30363d;
      --ph-fg:#7d8590; --copy-bg:#30363d; --copy-fg:#c9d1d9;
      --copy-border:#444c56; --copy-hover:#3c444d; }
  body.theme-light { color-scheme:light;
      --page-bg:#ffffff; --bar-bg:#f6f8fa; --bar-border:#d0d7de;
      --btn-bg:#f6f8fa; --btn-fg:#24292f; --btn-hover:#eaeef2;
      --ph-fg:#656d76; --copy-bg:#f6f8fa; --copy-fg:#24292f;
      --copy-border:#d0d7de; --copy-hover:#eaeef2; }
  html, body { height:100%; margin:0; background:var(--page-bg);
               font-family:system-ui,sans-serif; }
  #bar { position:sticky; top:0; z-index:2; display:flex; align-items:center;
         gap:8px; padding:5px 8px; background:var(--bar-bg);
         border-bottom:1px solid var(--bar-border); font-size:12px; }
  #bar .modes { display:flex; gap:2px; }
  #bar button { border:1px solid var(--bar-border); background:var(--btn-bg);
                color:var(--btn-fg); padding:3px 9px; border-radius:5px;
                cursor:pointer; font-size:12px; }
  #bar button:hover { background:var(--btn-hover); }
  #bar button.active { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  #bar .spacer { flex:1; }
  #scroll { position:absolute; top:33px; left:0; right:0; bottom:0; overflow:auto;
            background:var(--page-bg); }
  .markdown-body { box-sizing:border-box; min-width:0; max-width:920px;
                   margin:0 auto; padding:20px 26px; background:var(--page-bg); }
  .markdown-body pre { position:relative; }
  .copy-btn { position:absolute; top:6px; right:6px; padding:2px 8px; font-size:11px;
              background:var(--copy-bg); color:var(--copy-fg);
              border:1px solid var(--copy-border);
              border-radius:5px; cursor:pointer; opacity:0; transition:opacity .15s; }
  .markdown-body pre:hover .copy-btn { opacity:1; }
  .copy-btn:hover { background:var(--copy-hover); }
  /* A mermaid block that shows a rendered SVG (class managed by preview.js):
     drop the code-block box and centre the diagram. white-space:normal keeps
     the <pre> from leaking pre-formatting into the SVG's HTML labels
     (foreignObject). Failed/in-progress blocks keep the code-block look. */
  .markdown-body pre.mmd-done { background:transparent; padding:0;
                                white-space:normal; }
  .markdown-body pre.mmd-done svg { display:block; margin:0 auto; }
  /* Per-diagram zoom controls (preview.js): copy-btn styling, shown on hover. */
  .mmd-zoom { position:absolute; top:6px; right:6px; display:flex; gap:4px;
              opacity:0; transition:opacity .15s; }
  .markdown-body pre.mmd-done:hover .mmd-zoom { opacity:1; }
  .mmd-zoom button { padding:2px 8px; font-size:11px; background:var(--copy-bg);
                     color:var(--copy-fg); border:1px solid var(--copy-border);
                     border-radius:5px; cursor:pointer; }
  .mmd-zoom button:hover { background:var(--copy-hover); }
  /* Zoomed past 100%: no scrollbars — drag-to-pan instead (preview.js). The
     box is still a scroll container, so panning drives scrollLeft/Top, and
     the mouse wheel keeps scrolling the document, not the diagram. */
  .markdown-body pre.mmd-pan { overflow:hidden; cursor:grab; }
  .markdown-body pre.mmd-pan.mmd-panning { cursor:grabbing;
                                           user-select:none;
                                           -webkit-user-select:none; }
  #placeholder { color:var(--ph-fg); padding:26px; }
  #htmlframe { position:absolute; inset:0; width:100%; height:100%; border:0;
               background:#fff; display:none; }
</style>
</head>
<body class="theme-dark">
  <div id="bar">
    <span class="modes">
      <button data-mode="auto" class="active">Auto</button>
      <button data-mode="md">Markdown</button>
      <button data-mode="html">HTML</button>
    </span>
    <span class="spacer"></span>
    <button id="pin" title="Pin the preview to this document">&#x26b2; Pin</button>
    <button id="theme-toggle" title="Toggle preview background (dark / light)">&#x263e; Dark</button>
    <button id="refresh" title="Refresh">&#x21bb; Refresh</button>
  </div>
  <div id="scroll">
    <article id="content" class="markdown-body"></article>
    <div id="placeholder">Open a Markdown or HTML document to preview it.</div>
    <iframe id="htmlframe" sandbox="allow-scripts allow-popups allow-forms allow-modals"></iframe>
  </div>

  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/markdown-it-task-lists.min.js"></script>
  <script src="vendor/markdown-it-anchor.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script>
    /* MacPorts WebKitGTK JSC quirk: numbers > 2^31 collapse to -2147483648,
       Date.now() included (same workaround as term.js) — hand mermaid a small
       monotonic clock BEFORE it loads. */
    if (Date.now() < 0 && window.performance && performance.now() >= 0)
      Date.now = function () { return Math.floor(performance.now()); };
  </script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="preview.js"></script>
</body>
</html>
