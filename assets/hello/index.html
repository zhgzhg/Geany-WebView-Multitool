<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Geany WebView</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#1e1e22; color:#dcdce2;
         margin:0; padding:1.25rem; }
  h1 { font-size:1.1rem; margin:0 0 .5rem; }
  p  { margin:.25rem 0; color:#aab; font-size:.9rem; }
  button { margin-top:.75rem; padding:.4rem .8rem; border:1px solid #556;
           background:#2b2b31; color:#dcdce2; border-radius:6px; cursor:pointer; }
  button:hover { background:#34343b; }
  pre { margin-top:.75rem; padding:.5rem; background:#151519; border-radius:6px;
        font-size:.8rem; white-space:pre-wrap; max-height:9rem; overflow:auto; }
</style>
</head>
<body>
  <h1>Geany WebView</h1>
  <p>WebView2 is alive inside Geany.</p>
  <button id="ping">Ping native &rarr;</button>
  <pre id="log"></pre>

  <script>
    // The native side injects window.bridge before this page loads (M0.6).
    // Until then, degrade gracefully so the page still renders.
    const log = (m) => {
      const el = document.getElementById('log');
      el.textContent += m + '\n';
    };
    document.getElementById('ping').addEventListener('click', () => {
      if (window.bridge && window.bridge.post) {
        window.bridge.post('sys.ping', { t: Date.now() });
        log('posted sys.ping');
      } else {
        log('bridge not available yet');
      }
    });
    if (window.bridge && window.bridge.on) {
      window.bridge.on('sys.pong', (p) => log('pong: ' + JSON.stringify(p)));
    }
  </script>
</body>
</html>
