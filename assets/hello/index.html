<!doctype html>
<html lang="en">
<head>

<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Geany WebView</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#1e1e22; color:#dcdce2;

  <h1>Geany WebView</h1>
  <p>Reusable WebView host — first view.</p>
